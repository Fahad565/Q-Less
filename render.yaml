services:
  - type: web
    name: q-less-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/qless.db
      - key: AT_SMS_MODE
        value: mock
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: AFRICASTALKING_API_KEY
        value: mock_key
      - key: AFRICASTALKING_SENDER_ID
        value: QLess
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: q-less-staff
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://q-less-api.onrender.com
